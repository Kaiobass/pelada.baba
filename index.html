<script>
const STORAGE_KEY = 'fut-desastre-state-v4';
const POSITION_OPTIONS = [
    { value: 'goleiro', label: 'Goleiro', short: 'GK' },
    { value: 'defesa', label: 'Defesa', short: 'DEF' },
    { value: 'meia', label: 'Meia', short: 'MEI' },
    { value: 'ataque', label: 'Ataque', short: 'ATA' },
    { value: 'coringa', label: 'Coringa', short: 'ALL' }
];
const DEFAULT_PLAYER = { tech: 3, phys: 3, position: 'coringa' };
const DEMO_PLAYERS = [
    { name: 'Kaio', position: 'goleiro', tech: 3, phys: 3.5 },
    { name: 'Pedro', position: 'defesa', tech: 3.5, phys: 4 },
    { name: 'Joao', position: 'meia', tech: 4, phys: 3.5 },
    { name: 'Leo', position: 'ataque', tech: 4.5, phys: 3 },
    { name: 'Rafa', position: 'coringa', tech: 3, phys: 3 },
    { name: 'Bruno', position: 'defesa', tech: 2.5, phys: 4 },
    { name: 'Vitor', position: 'goleiro', tech: 2.5, phys: 3 },
    { name: 'Davi', position: 'meia', tech: 3.5, phys: 3 },
    { name: 'Igor', position: 'ataque', tech: 4, phys: 4 },
    { name: 'Breno', position: 'coringa', tech: 3, phys: 3.5 }
];

let players = new Map();
let currentTeams = [];
let tournamentMatches = [];
let activeMatchId = null;
let editingPlayerId = null;
let currentSection = 'convocar';

const elements = {
    bulkList: document.getElementById('bulkList'),
    btnImport: document.getElementById('btnImport'),
    btnDemo: document.getElementById('btnDemo'),
    teamSize: document.getElementById('teamSize'),
    matchDuration: document.getElementById('matchDuration'),
    summaryText: document.getElementById('summaryText'),
    counter: document.getElementById('counter'),
    listContainer: document.getElementById('listContainer'),
    emptyRoster: document.getElementById('emptyRoster'),
    btnAddPlayer: document.getElementById('btnAddPlayer'),
    btnDraw: document.getElementById('btnDraw'),
    resultsSection: document.getElementById('resultsSection'),
    tournamentSection: document.getElementById('tournamentSection'),
    toast: document.getElementById('toast'),
    ruleTopTwo: document.getElementById('ruleTopTwo'),
    ruleGoalkeepers: document.getElementById('ruleGoalkeepers'),
    playerModal: document.getElementById('playerModal'),
    rulesModal: document.getElementById('rulesModal'),
    modalTitle: document.getElementById('modalTitle'),
    modalPlayerId: document.getElementById('modalPlayerId'),
    modalPlayerName: document.getElementById('modalPlayerName'),
    modalPlayerPosition: document.getElementById('modalPlayerPosition'),
    modalPlayerTech: document.getElementById('modalPlayerTech'),
    modalPlayerPhys: document.getElementById('modalPlayerPhys'),
    modalTechValue: document.getElementById('modalTechValue'),
    modalPhysValue: document.getElementById('modalPhysValue'),
    btnDeleteFromModal: document.getElementById('btnDeleteFromModal'),
    btnCloseModal: document.getElementById('btnCloseModal')
};

// Navegação
document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        const section = btn.dataset.section;
        if (!section) return;
        
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        
        document.getElementById(section).classList.add('active');
        btn.classList.add('active');
        currentSection = section;
    });
});

function idFactory() {
    return `id-${Date.now()}-${Math.random().toString(16).slice(2)}`;
}

function showToast(message, tone = 'default') {
    const tones = {
        default: 'border-white/10 text-white',
        success: 'border-green-400/30 text-green-100',
        danger: 'border-red-400/30 text-red-100'
    };
    elements.toast.textContent = message;
    elements.toast.className = `fixed right-4 top-4 z-50 rounded-2xl bg-arena-panel/95 px-4 py-3 text-sm opacity-100 shadow-arena transition-all duration-300 ${tones[tone] || tones.default}`;
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(() => {
        elements.toast.className = elements.toast.className.replace('opacity-100', 'opacity-0');
    }, 2200);
}

function getOVR(player) {
    return (player.tech + player.phys) / 2;
}

function processBulkList(text) {
    return text
        .split(/\n/)
        .map(line => line.trim())
        .filter(line => line && !/^\d+\.?\s*$/.test(line))
        .map(line => {
            // Remove números, traços, parênteses no início
            return line.replace(/^[\d\.\$\-\s]+/, '').trim();
        })
        .filter((name, index, arr) => arr.indexOf(name) === index && name.length > 1)
        .map(name => ({
            id: idFactory(),
            name: name,
            ...DEFAULT_PLAYER
        }));
}

function addPlayer(playerData) {
    if (players.has(playerData.id)) {
        players.set(playerData.id, playerData);
    } else {
        players.set(playerData.id, playerData);
    }
    saveState();
    renderPlayers();
    syncUI();
}

function renderPlayers() {
    if (players.size === 0) {
        elements.emptyRoster.style.display = 'block';
        elements.listContainer.innerHTML = '';
        return;
    }
    
    elements.emptyRoster.style.display = 'none';
    elements.listContainer.innerHTML = Array.from(players.values())
        .sort((a, b) => getOVR(b) - getOVR(a))
        .map(player => `
            <div class="group flex items-center justify-between gap-3 rounded-3xl border border-white/5 bg-black/20 p-4 hover:border-white/20 transition-all">
                <div class="flex items-center gap-3 flex-1 min-w-0">
                    <div class="flex items-center gap-2">
                        <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-white/10 to-white/5 flex items-center justify-center">
                            <span class="text-xs font-bold uppercase tracking-wider text-white/60">${POSITION_OPTIONS.find(p => p.value === player.position)?.short || 'ALL'}</span>
                        </div>
                    </div>
                    <div class="min-w-0 flex-1">
                        <p class="font-semibold text-white truncate">${player.name}</p>
                        <div class="flex items-center gap-2 mt-1">
                            <div class="flex gap-0.5">
                                ${[...Array(5)].map((_, i) => {
                                    const ovr = getOVR(player);
                                    if (i < Math.floor(ovr - 0.5)) return '<span class="star star-full">★</span>';
                                    if (i < Math.floor(ovr + 0.5)) return '<span class="star star-half">★</span>';
                                    return '<span class="star">★</span>';
                                }).join('')}
                            </div>
                            <span class="text-[11px] text-white/50">${getOVR(player).toFixed(1)}</span>
                        </div>
                    </div>
                </div>
                <button onclick="editPlayer('${player.id}')" class="rounded-xl border border-white/20 px-3 py-2 text-xs font-bold uppercase tracking-wider text-white/60 hover:border-white/40 hover:text-white transition-all opacity-0 group-hover:opacity-100">Editar</button>
            </div>
        `).join('');
}

function syncUI() {
    const count = players.size;
    elements.counter.textContent = count;
    elements.summaryText.textContent = count === 0 
        ? 'Nenhum jogador carregado.' 
        : `${count} jogador${count !== 1 ? 'es' : ''} no elenco`;
}

function saveState() {
    const state = {
        players: Array.from(players.entries()),
        currentTeams,
        tournamentMatches
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function loadState() {
    try {
        const state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        if (state.players) {
            players = new Map(state.players);
        }
        currentTeams = state.currentTeams || [];
        tournamentMatches = state.tournamentMatches || [];
    } catch (e) {
        console.error('Erro ao carregar estado:', e);
    }
}

function populatePositionOptions() {
    elements.modalPlayerPosition.innerHTML = POSITION_OPTIONS.map(opt => 
        `<option value="${opt.value}">${opt.label}</option>`
    ).join('');
}

function editPlayer(id) {
    const player = players.get(id);
    if (!player) return;
    
    editingPlayerId = id;
    elements.modalTitle.textContent = player.name;
    elements.modalPlayerId.value = id;
    elements.modalPlayerName.value = player.name;
    elements.modalPlayerPosition.value = player.position;
    elements.modalPlayerTech.value = player.tech;
    elements.modalPlayerPhys.value = player.phys;
    elements.modalTechValue.textContent = player.tech;
    elements.modalPhysValue.textContent = player.phys;
    
    elements.modalPlayerPosition.closest('section').scrollIntoView({ behavior: 'smooth' });
    elements.playerModal.classList.remove('hidden');
}

function init() {
    populatePositionOptions();
    loadState();
    renderPlayers();
    syncUI();
    
    // Event Listeners
    elements.btnImport.addEventListener('click', () => {
        const text = elements.bulkList.value.trim();
        if (!text) {
            showToast('Cole a lista primeiro!', 'danger');
            return;
        }
        
        const newPlayers = processBulkList(text);
        let added = 0;
        
        newPlayers.forEach(player => {
            addPlayer(player);
            added++;
        });
        
        showToast(`✅ ${added} jogador${added !== 1 ? 'es' : ''} adicionado${added !== 1 ? 's' : ''}!`, 'success');
        elements.bulkList.value = '';
    });
    
    elements.btnDemo.addEventListener('click', () => {
        DEMO_PLAYERS.forEach(player => {
            player.id = idFactory();
            addPlayer(player);
        });
        showToast('✅ Demo carregada! 10 jogadores.', 'success');
    });
    
    elements.btnAddPlayer.addEventListener('click', () => {
        editingPlayerId = null;
        elements.modalTitle.textContent = 'Novo jogador';
        elements.modalPlayerName.value = '';
        elements.modalPlayerPosition.value = 'coringa';
        elements.modalPlayerTech.value = 3;
        elements.modalPlayerPhys.value = 3;
        elements.modalTechValue.textContent = '3.0';
        elements.modalPhysValue.textContent = '3.0';
        elements.playerModal.classList.remove('hidden');
    });
    
    // Modal handlers
    elements.modalPlayerTech.addEventListener('input', (e) => {
        elements.modalTechValue.textContent = parseFloat(e.target.value).toFixed(1);
    });
    
    elements.modalPlayerPhys.addEventListener('input', (e) => {
        elements.modalPhysValue.textContent = parseFloat(e.target.value).toFixed(1);
    });
    
    elements.btnCloseModal.addEventListener('click', () => {
        elements.playerModal.classList.add('hidden');
    });
    
    elements.playerModal.addEventListener('click', (e) => {
        if (e.target === elements.playerModal) {
            elements.playerModal.classList.add('hidden');
        }
    });
    
    // Form submit
    document.getElementById('playerForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const playerData = {
            id: editingPlayerId || idFactory(),
            name: elements.modalPlayerName.value.trim(),
            position: elements.modalPlayerPosition.value,
            tech: parseFloat(elements.modalPlayerTech.value),
            phys: parseFloat(elements.modalPlayerPhys.value)
        };
        
        if (!playerData.name) {
            showToast('Nome é obrigatório!', 'danger');
            return;
        }
        
        addPlayer(playerData);
        elements.playerModal.classList.add('hidden');
        showToast('✅ Jogador salvo!', 'success');
    });
    
    elements.btnDeleteFromModal.addEventListener('click', () => {
        if (editingPlayerId && players.has(editingPlayerId)) {
            players.delete(editingPlayerId);
            saveState();
            renderPlayers();
            syncUI();
            elements.playerModal.classList.add('hidden');
            showToast('🗑️ Jogador removido!', 'danger');
        }
    });
}

init();
</script>
