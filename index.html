<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FUT-DESASTRE | Matchmaker</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@500;700&display=swap" rel="stylesheet">

<script>
tailwind.config = {
    theme: {
        extend: {
            fontFamily: {
                sans: ['Inter', 'sans-serif'],
                display: ['Oswald', 'sans-serif']
            },
            colors: {
                arena: {
                    black: '#06070a',
                    panel: '#12151c',
                    panelSoft: '#191d26',
                    neon: '#dfff00',
                    cyan: '#38bdf8',
                    coral: '#fb7185',
                    gold: '#fbbf24'
                }
            },
            boxShadow: {
                arena: '0 28px 80px rgba(0,0,0,.38)'
            }
        }
    }
}
</script>

<style>

:root{
    color-scheme: dark;
}

html,body{
    overflow-x:hidden;
}

body{
    background:
        radial-gradient(circle at top, rgba(56,189,248,.14), transparent 28%),
        radial-gradient(circle at bottom right, rgba(223,255,0,.1), transparent 18%),
        linear-gradient(180deg,#07090c 0%,#050607 100%);
    color:#f8fafc;
    min-height:100vh;
    padding:1rem;
    font-family:Inter,sans-serif;
}

.container{
    max-width:480px;
    margin:auto;
    padding-bottom:110px;
}

.section{
    display:none;
    animation:fade .3s ease;
    width:100%;
}

.section.active{
    display:block;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.nav-bottom{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:480px;
    background:rgba(18,21,28,.95);
    backdrop-filter:blur(20px);
    display:flex;
    justify-content:space-around;
    border-top:1px solid rgba(255,255,255,.08);
    z-index:999;
    padding:.8rem 0;
}

.nav-btn{
    background:none;
    border:none;
    color:rgba(255,255,255,.6);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:.3rem;
    font-size:.72rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.06em;
    cursor:pointer;
    padding:.6rem;
    border-radius:14px;
    transition:.25s;
    touch-action:manipulation;
}

.nav-btn.active{
    background:rgba(223,255,0,.12);
    color:#dfff00;
}

.card{
    background:#12151c;
    border:1px solid rgba(255,255,255,.08);
    border-radius:28px;
    padding:1.1rem;
    box-shadow:0 28px 80px rgba(0,0,0,.38);
}

textarea,input,select{
    width:100%;
    background:rgba(0,0,0,.3);
    border:1px solid rgba(255,255,255,.08);
    color:white;
    border-radius:18px;
    padding:1rem;
    outline:none;
}

button{
    touch-action:manipulation;
}

.main-btn{
    width:100%;
    border:none;
    border-radius:18px;
    padding:1rem;
    font-weight:800;
    cursor:pointer;
    transition:.2s;
}

.main-btn:hover{
    transform:translateY(-2px);
}

.neon{
    background:#dfff00;
    color:black;
}

.blue{
    background:#38bdf8;
    color:white;
}

.team-card{
    border-radius:26px;
    padding:1rem;
    margin-bottom:1rem;
}

.player-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:rgba(0,0,0,.25);
    padding:.8rem 1rem;
    border-radius:16px;
    margin-top:.5rem;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.82);
    z-index:9999;
    display:none;
    align-items:center;
    justify-content:center;
    padding:1rem;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:420px;
    background:#12151c;
    border-radius:28px;
    padding:1.4rem;
    border:1px solid rgba(255,255,255,.08);
}

.toast{
    position:fixed;
    top:20px;
    right:20px;
    background:#12151c;
    color:white;
    padding:1rem 1.3rem;
    border-radius:16px;
    z-index:99999;
    opacity:0;
    transition:.3s;
}

.toast.show{
    opacity:1;
}

</style>
</head>

<body>

<div class="toast" id="toast"></div>

<nav class="nav-bottom">
    <button class="nav-btn active" data-section="players">👥<span>Jogadores</span></button>
    <button class="nav-btn" data-section="config">⚙️<span>Config</span></button>
    <button class="nav-btn" data-section="teams">🏆<span>Times</span></button>
</nav>

<div class="container">

<section class="section active" id="players">

<div class="card">

<h1 class="font-display text-4xl uppercase italic mb-5">
FUT-<span style="color:#dfff00;">DESASTRE</span>
</h1>

<p class="text-sm text-white/60 mb-4">
Cole os nomes:
</p>

<textarea id="bulkList" rows="7" placeholder="1. Kaio&#10;2. Pedro&#10;3. João"></textarea>

<div class="mt-4 flex flex-col gap-3">

<button id="btnImport" class="main-btn neon">
IMPORTAR
</button>

<button id="btnDemo" class="main-btn blue">
CARREGAR DEMO
</button>

</div>

</div>

<div class="card mt-5">

<div class="flex justify-between items-center mb-4">
<h2 class="text-2xl font-bold">Elenco</h2>
<div id="counter" class="text-3xl font-bold text-lime-300">0</div>
</div>

<div id="listContainer"></div>

</div>

</section>

<section class="section" id="config">

<div class="card">

<h2 class="text-3xl font-bold mb-5">
Configuração
</h2>

<label class="block mb-4">
<div class="mb-2 text-sm text-white/60">
Jogadores por time
</div>

<input type="number" id="teamSize" value="5" min="2" max="11">
</label>

<div class="space-y-4">

<label class="flex items-center justify-between">
<span>Separar os melhores</span>
<input type="checkbox" id="ruleTopTwo" checked>
</label>

<label class="flex items-center justify-between">
<span>Espalhar goleiros</span>
<input type="checkbox" id="ruleGoalkeepers" checked>
</label>

</div>

<button id="btnDraw" class="main-btn neon mt-6">
🎲 SORTEAR TIMES
</button>

</div>

</section>

<section class="section" id="teams">

<div class="card">

<div class="flex justify-between items-center mb-5">
<h2 class="text-3xl font-bold">
Times
</h2>

<button id="btnCopy" class="bg-white text-black px-4 py-2 rounded-xl font-bold">
Copiar
</button>
</div>

<div id="results"></div>

</div>

</section>

</div>

<div class="modal" id="playerModal">

<div class="modal-box">

<h3 class="text-2xl font-bold mb-5">
Editar jogador
</h3>

<input type="hidden" id="playerId">

<div class="space-y-4">

<input id="playerName" type="text" placeholder="Nome">

<select id="playerPosition">
<option value="goleiro">🧤 Goleiro</option>
<option value="defesa">🛡️ Defesa</option>
<option value="meia">⚙️ Meia</option>
<option value="ataque">🔥 Ataque</option>
<option value="coringa">🎭 Coringa</option>
</select>

<div>
<label>Técnica</label>
<input type="range" min="0.5" max="5" step="0.5" id="playerTech" value="3">
</div>

<div>
<label>Físico</label>
<input type="range" min="0.5" max="5" step="0.5" id="playerPhys" value="3">
</div>

</div>

<div class="flex gap-3 mt-6">

<button id="savePlayer" class="main-btn neon">
Salvar
</button>

<button id="deletePlayer" class="main-btn bg-red-500 text-white">
Excluir
</button>

</div>

</div>

</div>

<script>

const STORAGE_KEY = 'fut-desastre-final';

let players = new Map();
let currentTeams = [];

const bulkList = document.getElementById('bulkList');
const listContainer = document.getElementById('listContainer');
const counter = document.getElementById('counter');
const results = document.getElementById('results');

function showToast(msg){
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');

    setTimeout(()=>{
        toast.classList.remove('show');
    },2500);
}

function saveState(){
    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(Array.from(players.entries()))
    );
}

function loadState(){

    const data = JSON.parse(
        localStorage.getItem(STORAGE_KEY) || '[]'
    );

    players = new Map(data);

    renderPlayers();
}

function getOVR(player){
    return Number(
        (((player.tech)+(player.phys))/2).toFixed(1)
    );
}

function processBulkList(text){

    return text
    .split('\n')
    .map(v=>v.trim())
    .filter(Boolean)
    .map(v=>v.replace(/^\d+[\.\-\)]?\s*/,'').trim())
    .filter((name,index,arr)=>{

        const normalized = name.toLowerCase();

        return arr.findIndex(
            n=>n.toLowerCase()===normalized
        )===index;

    })
    .map(name=>({

        id:'p'+Date.now()+Math.random(),

        name,

        position:'coringa',

        tech:Number((3 + (Math.random()-0.5)).toFixed(1)),

        phys:Number((3 + (Math.random()-0.5)).toFixed(1))

    }));

}

function addPlayer(player){

    players.set(player.id,player);

    saveState();

    renderPlayers();
}

function renderPlayers(){

    counter.textContent = players.size;

    const arr = Array.from(players.values())
    .sort((a,b)=>getOVR(b)-getOVR(a));

    listContainer.innerHTML = '';

    arr.forEach(player=>{

        const div = document.createElement('div');

        div.className = 'player-item';

        div.innerHTML = `
            <div>
                <div class="font-bold">${player.name}</div>
                <div class="text-sm text-white/60">
                    OVR ${getOVR(player)}
                </div>
            </div>

            <button
                onclick="openEdit('${player.id}')"
                class="bg-cyan-500 px-4 py-2 rounded-xl font-bold"
            >
                Editar
            </button>
        `;

        listContainer.appendChild(div);

    });

}

function shuffleArray(arr){
    return [...arr].sort(()=>Math.random()-0.5);
}

function generateTeams(){

    const teamSize = parseInt(
        document.getElementById('teamSize').value
    );

    const totalNeeded = teamSize * 2;

    if(players.size < totalNeeded){
        showToast(`Precisa de ${totalNeeded} jogadores`);
        return;
    }

    let playerList = Array.from(players.values());

    playerList.sort(
        (a,b)=>getOVR(b)-getOVR(a)
    );

    const teamA = [];
    const teamB = [];

    const separateTop =
        document.getElementById('ruleTopTwo').checked;

    const spreadGK =
        document.getElementById('ruleGoalkeepers').checked;

    if(separateTop && playerList.length >=2){

        teamA.push(playerList.shift());
        teamB.push(playerList.shift());

    }

    if(spreadGK){

        const goalkeepers = playerList.filter(
            p=>p.position==='goleiro'
        );

        goalkeepers.forEach((gk,index)=>{

            if(teamA.length < teamSize && index%2===0){

                teamA.push(gk);

            }else if(teamB.length < teamSize){

                teamB.push(gk);

            }

        });

        playerList = playerList.filter(
            p=>p.position!=='goleiro'
        );

    }

    playerList = shuffleArray(playerList);

    while(playerList.length){

        const player = playerList.shift();

        const teamAOVR =
            teamA.reduce((s,p)=>s+getOVR(p),0);

        const teamBOVR =
            teamB.reduce((s,p)=>s+getOVR(p),0);

        if(teamA.length >= teamSize){

            teamB.push(player);

        }else if(teamB.length >= teamSize){

            teamA.push(player);

        }else{

            if(teamAOVR <= teamBOVR){

                teamA.push(player);

            }else{

                teamB.push(player);

            }

        }

    }

    currentTeams = [teamA,teamB];

    renderTeams();

    showToast('🎲 Times sorteados');

}

function renderTeams(){

    const teamA = currentTeams[0];
    const teamB = currentTeams[1];

    const teamAOVR = Number(
        teamA.reduce((s,p)=>s+getOVR(p),0).toFixed(1)
    );

    const teamBOVR = Number(
        teamB.reduce((s,p)=>s+getOVR(p),0).toFixed(1)
    );

    const balance = Math.abs(
        teamAOVR - teamBOVR
    ).toFixed(1);

    results.innerHTML = `
    
    <div class="team-card border border-lime-400/30 bg-lime-400/10">

        <div class="flex justify-between items-center mb-4">
            <h3 class="text-2xl font-bold text-lime-300">
                ⚡ TIME A
            </h3>

            <div class="font-bold text-xl">
                ${teamAOVR}
            </div>
        </div>

        ${
            teamA.map(player=>`
            
            <div class="player-item">
                <span>${player.name}</span>
                <span>${getOVR(player)}</span>
            </div>

            `).join('')
        }

    </div>

    <div class="team-card border border-cyan-400/30 bg-cyan-400/10">

        <div class="flex justify-between items-center mb-4">
            <h3 class="text-2xl font-bold text-cyan-300">
                🔥 TIME B
            </h3>

            <div class="font-bold text-xl">
                ${teamBOVR}
            </div>
        </div>

        ${
            teamB.map(player=>`
            
            <div class="player-item">
                <span>${player.name}</span>
                <span>${getOVR(player)}</span>
            </div>

            `).join('')
        }

    </div>

    <div class="mt-5 text-center">

        <div class="text-white/60">
            Diferença
        </div>

        <div class="text-3xl font-bold text-lime-300">
            ${balance}
        </div>

    </div>
    
    `;
}

document.getElementById('btnImport').onclick = ()=>{

    const text = bulkList.value.trim();

    if(!text){
        showToast('Cole nomes');
        return;
    }

    const arr = processBulkList(text);

    arr.forEach(addPlayer);

    bulkList.value = '';

    showToast(`${arr.length} jogadores adicionados`);

};

document.getElementById('btnDemo').onclick = ()=>{

    const demo = [
        ['Kaio','goleiro',4.5,4],
        ['Pedro','defesa',4,4],
        ['Leo','ataque',5,3.5],
        ['João','meia',4.6,3.9],
        ['Igor','coringa',3.7,4.1],
        ['Bruno','defesa',3.5,4.7],
        ['Rafa','ataque',4.2,3.6],
        ['Davi','meia',4.1,4],
        ['Vitor','goleiro',3.8,3.7],
        ['Breno','coringa',3.6,4]
    ];

    demo.forEach(p=>{

        addPlayer({
            id:'demo'+Math.random(),
            name:p[0],
            position:p[1],
            tech:p[2],
            phys:p[3]
        });

    });

    showToast('Demo carregada');

};

document.getElementById('btnDraw').onclick = generateTeams;

function openEdit(id){

    const player = players.get(id);

    if(!player) return;

    document.getElementById('playerModal')
    .classList.add('show');

    document.getElementById('playerId').value = id;
    document.getElementById('playerName').value = player.name;
    document.getElementById('playerPosition').value = player.position;
    document.getElementById('playerTech').value = player.tech;
    document.getElementById('playerPhys').value = player.phys;

}

document.getElementById('savePlayer').onclick = ()=>{

    const id =
        document.getElementById('playerId').value;

    const player = {

        id,

        name:
            document.getElementById('playerName').value,

        position:
            document.getElementById('playerPosition').value,

        tech:Number(
            document.getElementById('playerTech').value
        ),

        phys:Number(
            document.getElementById('playerPhys').value
        )

    };

    players.set(id,player);

    saveState();

    renderPlayers();

    closeModal();

    showToast('Jogador atualizado');

};

document.getElementById('deletePlayer').onclick = ()=>{

    const id =
        document.getElementById('playerId').value;

    players.delete(id);

    saveState();

    renderPlayers();

    closeModal();

    showToast('Jogador removido');

};

function closeModal(){

    document.getElementById('playerModal')
    .classList.remove('show');

}

document.getElementById('playerModal')
.onclick = (e)=>{

    if(e.target.id==='playerModal'){

        closeModal();

    }

};

document.getElementById('btnCopy').onclick = ()=>{

    if(!currentTeams.length) return;

    const text = `
⚽ FUT-DESASTRE ⚽

TIME A
${currentTeams[0]
.map(p=>`• ${p.name} (${getOVR(p)})`)
.join('\n')}

TIME B
${currentTeams[1]
.map(p=>`• ${p.name} (${getOVR(p)})`)
.join('\n')}
`;

    navigator.clipboard.writeText(text);

    showToast('Times copiados');

};

document.querySelectorAll('.nav-btn')
.forEach(btn=>{

    btn.onclick = ()=>{

        document.querySelectorAll('.nav-btn')
        .forEach(b=>b.classList.remove('active'));

        document.querySelectorAll('.section')
        .forEach(s=>s.classList.remove('active'));

        btn.classList.add('active');

        document
        .getElementById(btn.dataset.section)
        .classList.add('active');

    };

});

loadState();

</script>

</body>
</html>
